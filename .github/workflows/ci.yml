name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    # The API tests run against a real SQL Server, the same as locally.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Local!Test1234"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local!Test1234' -No -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet test --logger "console;verbosity=minimal"
        env:
          TASKFORGE_TEST_DB: Server=localhost,1433;Database=TaskForge_Tests;User Id=sa;Password=Local!Test1234;TrustServerCertificate=True

  client:
    name: Client build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
