@if (canManage()) {
  @if (errorMessage(); as message) {
    <div class="form-error" role="alert"><mat-icon>error</mat-icon>{{ message }}</div>
  }

  <form class="add-form" [formGroup]="form" (ngSubmit)="add()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>New label</mat-label>
      <input matInput formControlName="name" maxlength="30" placeholder="e.g. bug" />
    </mat-form-field>

    <div class="colors" role="radiogroup" aria-label="Label colour">
      @for (color of colors; track color) {
        <button
          type="button"
          class="swatch"
          [class.selected]="form.controls.color.value === color"
          [style.background]="color"
          [attr.aria-label]="'Colour ' + color"
          [attr.aria-pressed]="form.controls.color.value === color"
          (click)="form.controls.color.setValue(color)"
        ></button>
      }
    </div>

    <button mat-flat-button type="submit">Add</button>
  </form>
}

<ul class="labels">
  @for (label of labels(); track label.id) {
    <li>
      <app-label-chip [label]="label" />

      @if (canManage()) {
        <span class="colors small">
          @for (color of colors; track color) {
            <button
              type="button"
              class="swatch"
              [class.selected]="label.color === color"
              [style.background]="color"
              [attr.aria-label]="'Change ' + label.name + ' to ' + color"
              (click)="recolour(label, color)"
            ></button>
          }
        </span>

        <button mat-icon-button [attr.aria-label]="'Delete ' + label.name" (click)="remove(label)">
          <mat-icon>delete</mat-icon>
        </button>
      }
    </li>
  } @empty {
    <li class="muted">No labels yet.</li>
  }
</ul>
